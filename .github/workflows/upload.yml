name: Upload

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: upload

permissions: {}

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Dump
        run: |
          mkdir artifact artifact1 artifact2
          echo $GITHUB_SHA > raw-artifact
          echo $GITHUB_SHA > artifact/sha
          echo $GITHUB_SHA > artifact1/sha1
          echo $GITHUB_SHA > artifact2/sha2
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: artifact
          path: artifact
      - name: Upload raw
        uses: actions/upload-artifact@v7
        with:
          path: raw-artifact
          archive: false
      - name: Upload first
        uses: actions/upload-artifact@v7
        with:
          name: artifact1
          path: artifact1
      - name: Upload second
        uses: actions/upload-artifact@v7
        with:
          name: artifact2
          path: artifact2
